const P=a=>a.map(([o,t])=>((o-102)*10).toFixed(1)+','+((24-t)*10).toFixed(1)).join(' ');
const C=[[108,21.5],[107.4,21.3],[106.8,20.8],[106.5,20.25],[106.1,19.9],[105.9,19.3],[105.8,18.7],[106.2,18.1],[106.6,17.5],[107.2,16.9],[107.9,16.3],[108.2,16.1],[108.8,15.4],[109.1,14.5],[109.3,13.5],[109.2,12.8],[109.3,12.2],[109,11.4],[108.1,10.9],[107.1,10.35],[106.8,10.4],[106.7,9.9],[106,9.4],[105.5,9.1],[104.85,8.6],[104.8,9],[104.9,9.6],[105.1,10],[104.8,10.4],[104.5,10.4]];
const BD=[[104.6,10.9],[105.2,11],[105.9,11.6],[106.4,11.8],[106.9,12.2],[107.5,12.3],[107.5,13.2],[107.5,14.5],[107.3,15.2],[106.8,16],[106.5,16.6],[105.8,17.7],[105.1,18.4],[104.2,19.2],[104.3,20],[103.6,20.7],[103.1,20.9],[102.9,21.3],[102.2,21.6],[102.1,22.4],[102.5,22.8],[103,22.5],[103.9,22.5],[104.4,22.9],[105.3,23.3],[106,22.95],[106.7,22.85],[107.4,22]];
const SEA=[...C,[104.2,10.4],[104.2,8],[110,8],[110,24],[108,24]];
const tx=(x,y,s)=>`<text x="${x}" y="${y}" font-size="3" text-anchor="middle" fill="var(--mut)" opacity=".8">${s}</text>`;
const best=L.map(()=>null);let cur,map=document.getElementById('map'),M=document.getElementById('m'),B=document.getElementById('s');
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function init(){map.innerHTML=`<svg viewBox="0 0 80 160" preserveAspectRatio="none" aria-label="Bản đồ Việt Nam thời kháng chiến chống Pháp"><polygon points="${P(SEA)}" fill="var(--sea)"/><polygon points="${P([...C,...BD.map(x=>x)])}" fill="var(--land)" stroke="var(--line)" stroke-width=".5"/><line x1="${(105.4-102)*10}" x2="${(108.3-102)*10}" y1="70" y2="70" stroke="var(--red)" stroke-width=".5" stroke-dasharray="2 1.5"/>${tx(21,12,'TRUNG QUỐC')}${tx(8,52,'LÀO')}${tx(22,118,'CAM-PU-CHIA')}${tx(43,40,'BẮC BỘ')}${tx(58,95,'TRUNG BỘ')}${tx(33,146,'NAM BỘ')}${tx(66,60,'Vịnh Bắc Bộ')}${tx(68,115,'BIỂN ĐÔNG')}</svg>`;
L.forEach((v,i)=>{const b=document.createElement('button');b.className='n '+v.sd;b.id='n'+i;b.style.left=((v.p[0]-102)/8*100)+'%';b.style.top=((24-v.p[1])/16*100)+'%';b.onclick=()=>intro(i);map.appendChild(b)});up()}
function up(){const c=best.findIndex(x=>x===null||x<3);let t=0;best.forEach(x=>t+=x||0);document.getElementById('p').textContent='Đã qua '+best.filter(x=>x>=3).length+'/'+L.length+' màn';document.getElementById('tt').textContent='⭐ '+t+'/'+L.length*5;
L.forEach((v,i)=>{const b=document.getElementById('n'+i),k=c>=0&&i>c,pass=best[i]>=3;b.disabled=k;b.className='n '+v.sd+(k?' k':'')+(i===c?' c':'')+(pass?' d':'');b.innerHTML=(k?'🔒':pass?'✅':v.e)+'<i>'+v.n+(best[i]!==null?'<br><span style="color:var(--gold)">'+stars(best[i])+'</span>':'')+'</i>'})}
function intro(i){cur={i,k:0,s:0,r:[]};const v=L[i];B.innerHTML='<h2>Màn '+(i+1)+': '+v.e+' '+v.n+'</h2><div class="dt">'+v.d+'</div><p>'+v.t+'</p><button class="go" id="a">Bắt đầu 5 câu hỏi</button><button class="go g" id="x">Đóng</button>';B.querySelector('#a').onclick=ask;B.querySelector('#x').onclick=cl;M.classList.add('on')}
function cl(){M.classList.remove('on')}
function ask(){const v=L[cur.i],[q,o,a,ex]=v.q[cur.k],ix=o.map((_,j)=>j).sort(()=>Math.random()-.5);
B.innerHTML='<div class="st" aria-label="Sao màn này">'+cur.r.map(x=>x?'★':'☆').join('')+'☆'.repeat(5-cur.r.length)+'</div><div class="dt">'+v.n+' · Câu '+(cur.k+1)+'/5</div><p class="q">'+q+'</p><div id="op"></div><div class="fb" id="fb"></div>';
const op=B.querySelector('#op'),fb=B.querySelector('#fb');
ix.forEach(j=>{const b=document.createElement('button');b.className='o';b.textContent=o[j];b.onclick=()=>{const ok=j===a;op.querySelectorAll('.o').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');if(!ok)[...op.children][ix.indexOf(a)].classList.add('ok');cur.r.push(ok);if(ok)cur.s++;fb.textContent=(ok?'Chính xác! +1 ⭐ ':'Chưa đúng, đáp án đúng đã được đánh dấu. ')+ex;const n=document.createElement('button');n.className='go';n.textContent=cur.k<4?'Câu tiếp':'Xem kết quả';n.onclick=()=>{cur.k++;cur.k<5?ask():fin()};B.appendChild(n)};op.appendChild(b)})}
function fin(){const i=cur.i,s=cur.s,ok=s>=3;best[i]=Math.max(best[i]||0,s);up();
B.innerHTML='<h2>'+L[i].n+': '+s+'/5 ⭐</h2><div class="st">'+stars(s)+'</div><p class="q">'+(ok?(i<L.length-1?'Đạt! Màn '+(i+2)+' đã mở khóa.':'Đạt! Bạn đã hoàn thành hành trình 🏅'):'Cần ít nhất 3⭐ để qua màn. Đọc lại thẻ và thử lại nhé!')+'</p><button class="go" id="a">'+(ok?'Chơi lại màn này':'Thử lại')+'</button><button class="go g" id="x">Về bản đồ</button>';
B.querySelector('#a').onclick=()=>intro(i);B.querySelector('#x').onclick=cl}
init();
</script></body></html>
